<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Main gradient: teal to green, matching the dfsui logo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <!-- Icon gradient: slightly lighter for contrast -->
    <linearGradient id="icon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Bar chart: 3 bars of increasing height, centered -->
  <rect x="6" y="18" width="4" height="8" rx="1" fill="url(#icon)"/>
  <rect x="12" y="13" width="4" height="13" rx="1" fill="url(#icon)"/>
  <rect x="18" y="8" width="4" height="18" rx="1" fill="url(#icon)"/>

  <!-- Magnifying glass circle -->
  <circle cx="22" cy="11" r="5" stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
  <!-- Magnifying glass handle -->
  <line x1="25.5" y1="14.5" x2="28" y2="17" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
